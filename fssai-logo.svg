<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="fssaiNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a66"/>
      <stop offset="100%" stop-color="#172D50"/>
    </linearGradient>
    <linearGradient id="fssaiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6b85c"/>
      <stop offset="50%" stop-color="#ffd573"/>
      <stop offset="100%" stop-color="#c9952a"/>
    </linearGradient>
    <linearGradient id="fssaiOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <linearGradient id="fssaiGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#28a745"/>
    </linearGradient>
    <path id="fssaiTextPathTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
    <path id="fssaiTextPathBot" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#fssaiGold)"/>
  <circle cx="100" cy="100" r="91" fill="#FFFFFF"/>
  <circle cx="100" cy="100" r="88" fill="url(#fssaiNavy)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#fssaiGold)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Top Curved Text -->
  <text fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="800" letter-spacing="2">
    <textPath href="#fssaiTextPathTop" startOffset="50%" text-anchor="middle">FOOD SAFETY &amp; STANDARDS</textPath>
  </text>

  <!-- Bottom Curved Text -->
  <text fill="url(#fssaiGold)" font-family="'Poppins', sans-serif" font-size="10" font-weight="800" letter-spacing="2">
    <textPath href="#fssaiTextPathBot" startOffset="50%" text-anchor="middle">★ AUTHORITY OF INDIA ★</textPath>
  </text>

  <!-- Center White Emblem Disc -->
  <circle cx="100" cy="100" r="54" fill="#FFFFFF" stroke="url(#fssaiGold)" stroke-width="2.5"/>

  <!-- Tricolor Curved Ribbon Swashes -->
  <path d="M 68,76 C 85,68 115,68 132,76" fill="none" stroke="url(#fssaiOrange)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 68,124 C 85,132 115,132 132,124" fill="none" stroke="url(#fssaiGreen)" stroke-width="3" stroke-linecap="round"/>

  <!-- Iconic FSSAI Wordmark -->
  <text x="100" y="106" fill="#172D50" font-family="'Poppins', 'Mukta', sans-serif" font-size="29" font-weight="900" font-style="italic" text-anchor="middle" letter-spacing="-1">fssai</text>
  
  <!-- Subtitle -->
  <text x="100" y="117" fill="#555555" font-family="'Poppins', sans-serif" font-size="6.5" font-weight="800" text-anchor="middle" letter-spacing="1">STANDARDS COMPLIANT</text>
</svg>
